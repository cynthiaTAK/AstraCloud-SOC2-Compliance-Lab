utive report</text><text x="945" y="244" fill="#d8f4f2" font-size="13">GitHub README</text></g><g stroke="#4c788c" stroke-width="4" fill="none"><path d="M255 197 H299"/><path d="M525 197 H569"/><path d="M795 197 H839"/></g><g fill="#4c788c"><path d="M299 197 l-10 -7 v14z"/><path d="M569 197 l-10 -7 v14z"/><path d="M839 197 l-10 -7 v14z"/></g><rect x="35" y="317" width="1010" height="84" rx="12" fill="#fff4d9"/><text x="55" y="347" font-family="Arial" font-size="17" font-weight="bold" fill="#664d14">Audit interpretation safeguard</text><text x="55" y="373" font-family="Arial" font-size="15" fill="#664d14">Evidence acceptance ≠ control effectiveness. Overdue evidence ≠ confirmed control failure. All outcomes are simulated.</text></svg>